menuentry "Ivseznayfews" {
    multiboot /boot/ivseznayfews.elf
    boot
}
cat > Makefile << 'EOF'
CXX      := g++
LD       := ld
AS       := nasm
CXXFLAGS := -m64 -ffreestanding -fno-exceptions -fno-rtti -fno-stack-protector \
            -nostdlib -Wall -Wextra -Ikernel -mno-red-zone -mcmodel=kernel \
            -fno-pic -fno-pie
LDFLAGS  := -m elf_x86_64 -T linker.ld

OBJS := boot/boot.o kernel/kmain.o kernel/vga.o

all: ivseznayfews.iso

boot/%.o: boot/%.asm
	$(AS) -f elf64 $< -o $@

kernel/%.o: kernel/%.cpp
	$(CXX) $(CXXFLAGS) -c $< -o $@

ivseznayfews.elf: $(OBJS) linker.ld
	$(LD) $(LDFLAGS) $(OBJS) -o $@

ivseznayfews.iso: ivseznayfews.elf iso/boot/grub/grub.cfg
	cp ivseznayfews.elf iso/boot/
	grub-mkrescue -o $@ iso

run: ivseznayfews.iso
	qemu-system-x86_64 -cdrom ivseznayfews.iso -serial stdio

clean:
	rm -f $(OBJS) ivseznayfews.elf ivseznayfews.iso iso/boot/ivseznayfews.elf
