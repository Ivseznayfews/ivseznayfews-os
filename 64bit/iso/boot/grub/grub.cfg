set timeout=2
set default=0

menuentry "Ivseznayfews - graphical desktop" {
    multiboot /boot/ivseznayfews.elf
    # multiboot applies the header preference; override it after loading.
    set gfxpayload=1024x768x32,800x600x32,text
    boot
}

menuentry "Ivseznayfews - text recovery" {
    multiboot /boot/ivseznayfews.elf text
    set gfxpayload=text
    boot
}
